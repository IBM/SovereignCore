{{- if .Values.kbsRouteCert.enabled }}
---
# On KBS certificate rotation, copy it to tenants and rerun coco-initdata: the certificate is measured.
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  name: kbs-route-cert-eso
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: coco-initdata
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.kbsRouteCert.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: tls.crt
      remoteRef:
        key: '{{ .Values.kbsRouteCert.vaultKey | default (printf "%s/%s" (include "coco-initdata.vaultPrefix" .) .Values.kbsRouteCert.vaultLeaf) }}'
        property: certificate
{{- end }}
