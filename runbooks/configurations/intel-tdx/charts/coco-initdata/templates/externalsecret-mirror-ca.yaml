{{- if .Values.mirrorCA.enabled }}
---
# The mirror CA is measured; rerun coco-initdata to register its matching reference value.
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  name: mirror-ca-eso
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: coco-initdata
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.mirrorCA.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: pem
      remoteRef:
        key: '{{ .Values.mirrorCA.vaultKey | default (printf "%s/%s" (include "coco-initdata.vaultPrefix" .) .Values.mirrorCA.vaultLeaf) }}'
        property: ca
{{- end }}
