{{- if .Values.createServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: coco-initdata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coco-initdata
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: coco-initdata
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coco-initdata
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: coco-initdata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coco-initdata
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Values.namespace }}
{{- end }}
