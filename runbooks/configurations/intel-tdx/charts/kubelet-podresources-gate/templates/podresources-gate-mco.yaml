{{- if .Values.podResourcesGet.enabled }}
{{- /* WORKAROUND ONLY; remove after upgrading to kubelet >= 1.34 (OpenShift 4.21). Applying this reboots nodes. */ -}}
{{- range .Values.podResourcesGet.roles }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-podresources-get-{{ . }}
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
        - path: /etc/systemd/system-generators/kubelet-podresources-gate
          mode: 493
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,{{ $.Files.Get "files/kubelet-podresources-gate" | b64enc }}
{{- end }}
{{- end }}
